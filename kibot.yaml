kibot:
  version: 1

preflight:
  erc: true
  run_drc: true

outputs:
  - name: schematic_pdf
    comment: Schematic PDF
    type: pdf_sch_print
    dir: Fabrication/PDFs

  - name: ibom
    comment: Interactive BOM
    type: ibom
    dir: Fabrication/ibom
    options:
      name_format: "index"

  - name: JLCPCB_gerbers
    comment: Gerbers for JLCPCB
    type: gerber
    dir: Fabrication/JLCPCB_layers
    options:
      use_protel_extensions: true
      subtract_mask_from_silk: true
    layers:
      - F.Cu
      - B.Cu
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  - name: JLCPCB_drill
    comment: Drill files
    type: excellon
    dir: Fabrication/JLCPCB_layers
    options:
      pth_and_npth_single_file: false

  - name: JLCPCB_zip
    comment: ZIP for ordering
    type: compress
    dir: Fabrication/JLCPCB
    options:
      files:
        - from_output: JLCPCB_gerbers
          dest: /
        - from_output: JLCPCB_drill
          dest: /

  - name: schematic_svg
    comment: Schematic image
    type: svg_sch_print
    dir: Fabrication/PDFs

  - name: pcb_render
    comment: PCB 3D render
    type: render_3d
    dir: Fabrication/Images
    options:
      ray_tracing: true
      width: 1920
      height: 1080
      output: pcb-render.png

  - name: pcb_copper_pdf
    comment: PCB copper layers PDF
    type: pdf_pcb_print
    dir: Fabrication/PDFs
    options:
      output: pcb-copper.pdf
    layers:
      - F.Cu
      - B.Cu
      - F.Silkscreen
      - B.Silkscreen
      - Edge.Cuts

  - name: pcb_copper_image
    comment: PCB copper layers image
    type: pcb_print
    dir: Fabrication/Images
    options:
      output: pcb-copper.svg
      format: SVG
    layers:
      - F.Cu
      - B.Cu
      - F.Silkscreen
      - B.Silkscreen
      - Edge.Cuts
