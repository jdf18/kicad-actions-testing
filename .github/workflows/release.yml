name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  fabrication:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/inti-cmnb/kicad10_auto:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Run KiBot outputs
        run: kibot -c kibot.yaml

      - name: Convert schematic SVG to PNG
        run: convert -density 150 Fabrication/Images/schematic.svg Fabrication/Images/schematic.png

      - name: Convert pcb SVG to PNG
        run: convert -density 150 Fabrication/Images/pcb-copper.svg Fabrication/Images/pcb-copper.png

      - name: Create GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fabrication/PDFs/*.pdf
            Fabrication/PDFs/*.svg
            Fabrication/Images/*.png
            Fabrication/Images/*.svg
            Fabrication/JLCPCB/*.zip
            Fabrication/ibom/*.html
          body: |
            ## Fabrication outputs for ${{ github.ref_name }}

            ### PCB Render
            ![PCB Render](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pcb-render.png)

            ### Schematic
            ![Schematic](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/schematic.png)

            ### PCB Layers
            ![PCB Copper](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pcb-copper.png)

            ### iBOM
            [Interactive BOM](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sample-board-ibom.html)

            - [Schematic PDF](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sample-board-schematic.pdf) attached below
            - [PCB layers PDF](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pcb-copper.pdf) attached below
            - [JLCPCB gerber zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sample-board-JLCPCB_zip.zip) attached below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
