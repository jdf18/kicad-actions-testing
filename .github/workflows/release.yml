name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  fabrication:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad10_auto:1.8.3
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Run KiBot outputs
        run: kibot -c kibot.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fabrication/PDFs/*.pdf
            Fabrication/JLCPCB/*.zip
            Fabrication/ibom/*.html
          body: |
            ## Fabrication outputs for ${{ github.ref_name }}
            - Schematic PDF attached below
            - JLCPCB gerber zip attached below
            - Interactive iBOM attached below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
