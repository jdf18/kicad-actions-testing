name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  fabrication:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/inti-cmnb/kicad10_auto:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Run KiBot outputs
        run: kibot -c kibot.yaml

      - name: Create GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fabrication/PDFs/*.pdf
            Fabrication/PDFs/*.svg
            Fabrication/Images/*.png
            Fabrication/Images/*.svg
            Fabrication/JLCPCB/*.zip
            Fabrication/ibom/*.html
          body: |
            ## Fabrication outputs for ${{ github.ref_name }}

            ### PCB Render
            ![PCB Render](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pcb-render.png)

            ### Schematic
            ![Schematic](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/schematic.png)

            ### PCB Layers
            ![PCB Copper](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pcb-copper.png)

            - Schematic PDF attached below
            - PCB layers PDF attached below
            - JLCPCB gerber zip attached below
            - Interactive iBOM attached below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
